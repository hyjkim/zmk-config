layout: {zmk_keyboard: corne}
layers:
  default:
  - ['', Q, W, E, R, T]
  - [Y, U, I, O, P, '']
  - ['', A, S, D, F, G]
  - [H, J, K, L, '''', '']
  - ['', Z, X, C, V, B]
  - [N, M, ',', ., BSPC, '']
  - ['&cl1', '&cl2', LSHFT, LCTRL, SPACE, '&cl3']
  number:
  - ['', VOLUME DOWN, VOLUME UP, BRI DN, BRI UP, KP MULTIPLY]
  - - {t: +, h: F12}
    - {t: '7', h: F7}
    - {t: '8', h: F8}
    - {t: '9', h: F9}
    - ''
    - ''
  - ['', '', '=', ':', '', KP DIVIDE]
  - - {t: '-', h: F11}
    - {t: '4', h: F4}
    - {t: '5', h: F5}
    - {t: '6', h: F6}
    - ENTER
    - ''
  - ['', TAB, PLAY PAUSE, NEXT, ., KP EQUAL]
  - - {t: ., h: F10}
    - {t: '1', h: F1}
    - {t: '2', h: F2}
    - {t: '3', h: F3}
    - {t: ▽, type: trans}
    - ''
  - - '&cl1'
    - '&cl2'
    - LSHFT
    - {t: '0', h: LCTRL}
    - {t: default, h: toggle}
    - '&cl3'
  symbol:
  - ['', '~', '', '', (, '']
  - ['', ), +, '?', '|', '']
  - ['', '`', '=', ':', '{', <]
  - ['>', '}', '-', _, '"', '']
  - ['', TAB, '', ;, '[', '']
  - - ''
    - ']'
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - ''
  - - '&force_sl1'
    - '&cl2'
    - LSHFT
    - {t: LCTRL, h: sticky}
    - {t: default, h: toggle}
    - '&cl3'
  nav:
  - ['', '', '', Alt+RIGHT ARROW, Gui+Sft+Z, '']
  - - Gui+C
    - Gui+Z
    - {t: default, h: toggle}
    - DEL
    - Gui+V
    - ''
  - - ''
    - ''
    - {t: Gui+Ctl+Sft+4, h: Gui+Sft+4}
    - Gui+X
    - ''
    - ''
  - [LEFT ARROW, DOWN ARROW, UP ARROW, RIGHT ARROW, ENTER, '']
  - ['', TAB, DEL, '', '', Alt+LEFT ARROW]
  - - ''
    - Gui+[
    - Gui+]
    - ''
    - {t: ▽, type: trans}
    - ''
  - - '&force_sl1'
    - '&cl2'
    - LSHFT
    - {t: LCTRL, h: sticky}
    - {t: default, h: toggle}
    - '&cl3'
  settings:
  - ['', '', '', '', '', '']
  - - ''
    - {t: BT, h: '0'}
    - BT PRV
    - BT NXT
    - ''
    - ''
  - ['', '', '', '', '', '']
  - ['', '&soft_off', '', '', '', '']
  - ['', '', '', '', '', '']
  - ['', '', '', '', '', '']
  - - '&force_sl1'
    - '&cl2'
    - LSHFT
    - {t: LCTRL, h: sticky}
    - {t: default, h: toggle}
    - '&cl3'
combos:
- p: [13, 25]
  k: ESC
- p: [33, 34]
  k: RET
- p: [32, 33]
  k: RET
- p: [25, 26]
  k: TAB
- p: [26, 27]
  k: TAB
- p: [15, 16]
  k: LEFT COMMAND
- p: [16, 14]
  k: LEFT ALT
- p: [16, 15, 14]
  k: Gui+LEFT ALT
- p: [19, 20]
  k: RIGHT COMMAND
- p: [19, 21]
  k: RIGHT ALT
- p: [19, 20, 21]
  k: Gui+RIGHT ALT
- p: [4, 16]
  k: Gui+RIGHT ARROW
  l: [nav]
- p: [6, 18]
  k: Gui+LEFT ARROW
  l: [nav]
- p: [2, 3, 4]
  k: {t: settings, h: toggle}
  l: [nav]
- p: [7, 8, 9]
  k: BT CLR
  l: [settings]
- p: [1, 13]
  k: '!'
- p: [2, 14]
  k: '@'
- p: [3, 15]
  k: '#'
- p: [4, 16]
  k: $
  l: [default, number, symbol]
- p: [5, 17]
  k: '%'
- p: [6, 18]
  k: ^
  l: [default, number, symbol]
- p: [7, 19]
  k: '&'
- p: [8, 20]
  k: KP MULTIPLY
- p: [9, 21]
  k: /
- p: [10, 22]
  k: \
- p: [1, 2]
  k: '~'
- p: [22, 34]
  k: GLOBE
  l: [default]
